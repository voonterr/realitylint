<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RealityLint</title>
  <desc id="desc">README drift detector by voonterr</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="0.55" stop-color="#17102f"/>
      <stop offset="1" stop-color="#251044"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="220" fill="#7c3aed" opacity="0.22" filter="url(#glow)"/>
  <circle cx="110" cy="585" r="190" fill="#0891b2" opacity="0.16" filter="url(#glow)"/>
  <g transform="translate(90 115)">
    <rect x="0" y="0" width="96" height="96" rx="23" fill="#ffffff" opacity="0.08"/>
    <path d="M26 50l15 15 33-38" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="72" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="76">RealityLint</text>
    <text x="2" y="168" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="36">Your README says it works.</text>
    <text x="2" y="216" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36">Check if the repository agrees.</text>
    <text x="2" y="288" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="25">Static · deterministic · local-first · no LLM</text>
  </g>
  <g transform="translate(90 520)" font-family="Arial, Helvetica, sans-serif" font-size="21">
    <rect width="178" height="48" rx="24" fill="#ffffff" opacity="0.08"/><text x="28" y="31" fill="#ddd6fe">README drift</text>
    <rect x="194" width="170" height="48" rx="24" fill="#ffffff" opacity="0.08"/><text x="224" y="31" fill="#ddd6fe">GitHub Action</text>
    <rect x="380" width="126" height="48" rx="24" fill="#ffffff" opacity="0.08"/><text x="410" y="31" fill="#ddd6fe">SARIF</text>
  </g>
  <text x="1110" y="557" text-anchor="end" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">by @voonterr</text>
</svg>
